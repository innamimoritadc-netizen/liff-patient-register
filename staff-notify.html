<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空き通知送信（スタッフ用） - 森田歯科</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; background:#f7f7f7; margin:0; padding:24px 16px; }
  .card { background:#fff; border-radius:12px; padding:24px 20px; max-width:420px; margin:0 auto; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size:18px; margin:0 0 8px; }
  p.desc { font-size:14px; color:#555; margin:0 0 20px; }
  label { display:block; font-size:14px; margin:16px 0 6px; color:#333; }
  input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:8px; }
  button { width:100%; margin-top:24px; padding:14px; font-size:16px; font-weight:bold; color:#fff; background:#06c755; border:none; border-radius:8px; }
  button:disabled { background:#aaa; }
  #status { margin-top:16px; font-size:14px; text-align:center; }
  #status.error { color:#c0392b; }
  #status.ok { color:#06c755; }
</style>
</head>
<body>
  <div class="card">
    <h1>空き通知送信</h1>
    <p class="desc">空きが出た日にち・時間を選んで送信してください。その日を希望してキャンセル待ち登録している患者さん全員にLINEで通知します（自動予約にはなりません。患者さんからのお電話をお待ちください）。</p>
    <form id="form">
      <label for="open_date">日にち</label>
      <input id="open_date" name="open_date" type="date" required>
      <label for="open_time">時間</label>
      <input id="open_time" name="open_time" type="time" required>
      <button id="submitBtn" type="submit">この内容で通知を送信する</button>
    </form>
    <div id="status"></div>
  </div>

<script>
  const WEBHOOK_URL = "https://hook.us2.make.com/pmtgwmjgkctj9lwsqdmm7glhgrdrbudt";

  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submitBtn');

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const open_date = document.getElementById('open_date').value;
    const open_time = document.getElementById('open_time').value;

    if (!confirm(open_date + ' を希望している患者さん全員に\n' + open_date + ' ' + open_time + ' の空きをLINE通知します。よろしいですか？')) {
      return;
    }

    btn.disabled = true;
    setStatus('送信中...');
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ open_date, open_time })
      });

      if (!res.ok) throw new Error('送信失敗');
      setStatus('送信しました。', 'ok');
      document.getElementById('form').reset();
    } catch (err) {
      setStatus('エラーが発生しました。もう一度お試しください。', 'error');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
